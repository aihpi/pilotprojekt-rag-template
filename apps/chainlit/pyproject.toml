[project]
name = "rag-chainlit"
version = "0.1.0"
description = "Config-driven Chainlit RAG app (LiteLLM + Qdrant + Docling)"
requires-python = ">=3.12"
dependencies = [
    "chainlit==2.11.0",
    "asyncpg>=0.29.0",
    "litellm>=1.75.8",
    "qdrant-client>=1.14.1",
    "python-dotenv>=1.0.1",
    "openai-harmony>=0.0.1",
    "docling>=1.5.0",
    "bcrypt>=4.1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-static-i18n>=1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
