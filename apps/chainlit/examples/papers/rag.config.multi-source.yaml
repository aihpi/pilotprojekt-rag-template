# This config file shows how to add multiple sources.
#
# To run this instance, point RAG_CONFIG at it in apps/chainlit/.env:
#
#   RAG_CONFIG=examples/papers/rag.config.multi-source.yaml

name: papers-multi-source
language: de

models:
  chat_model: gpt-oss-120b
  fallback_chat_model: gemma-4-31b
  embed_model: octen-embedding-8b

vector_store:
  collection: papers_multi_source     # its own collection, so its own ingest run

# One entry per part of the corpus:
#
#   name            identifies the source in ingest output, and in
#                   `python -m kb.ingest --only bis-2019`
#   path            folder to read, relative to this file
#   format          which parser handles it: pdf | txt | md | json | csv | custom
#   glob            which files in `path` belong here. Python pathlib patterns, all
#                   examples below against the nine shipped papers:
#                     *       any run of characters, including none.
#                             "*.pdf" takes all nine
#                     ?       exactly one character. "*_202?_*.pdf" takes the six
#                             from 2020 on, "*_20??_*.pdf" takes all nine
#                     [seq]   one character from the set. "Kage_20[12]*" takes
#                             Kage_2018 and Kage_2020
#                     [!seq]  one character not in the set. "[!K]*.pdf" takes the
#                             seven that do not start with K
#                     **/     descend into subdirectories. "**/*.pdf"
#                   Case-sensitive, so "*.pdf" skips a file named ".PDF". Brace
#                   expansion does not work: "{a,b}*.pdf" matches nothing rather than
#                   failing, which is easy to miss. Ignored if `path` names a single
#                   file. The three sources below read the same folder and differ
#                   only by pattern, which is how one directory becomes three
#                   labelled parts
#   extra_metadata  copied onto every chunk this source produces. This is the label
#                   the profiles further down filter on
#   chunking        overrides the global strategy, for this source only
#   pdf_options     parser settings, `format: pdf` only
data_sources:
  - name: bis-2019
    path: ../../data/documents
    format: pdf
    glob: "*_201*.pdf"
    extra_metadata: { zeitraum: bis_2019 }
    # Per-source chunking: this part uses heading, the others semantic. A short
    # document and a long one rarely want the same strategy.
    chunking:
      strategy: heading
    pdf_options:
      include_tables: true

  - name: 2020-2023
    path: ../../data/documents
    format: pdf
    glob: "*_202[0-3]*.pdf"
    extra_metadata: { zeitraum: "2020_2023" }
    chunking:
      strategy: semantic
      semantic_breakpoint_percentile: 95.0
    pdf_options:
      include_tables: true

  - name: ab-2024
    path: ../../data/documents
    format: pdf
    glob: "*_202[4-9]*.pdf"
    extra_metadata: { zeitraum: ab_2024 }
    chunking:
      strategy: semantic
      semantic_breakpoint_percentile: 95.0
    pdf_options:
      include_tables: true

retrieval:
  top_k: 5
  hybrid: true
  fusion: rrf
  prefetch_limit: 30
  payload_indexes: [zeitraum]                   # Qdrant index for the label
  filterable_fields: [source_file, zeitraum]    # allow-list: a filter on a field
                                                # not listed here is ignored

# Each role scopes retrieval to one part. A role with no filter searches all of them.
profiles:
  - id: alles
    name: "Gesamter Bestand"
    description: "Alle neun Paper"

  - id: bis-2019
    name: "Bis 2019"
    description: "Nur die älteren Arbeiten"
    retrieval_filters: { zeitraum: bis_2019 }

  - id: 2020-2023
    name: "2020 bis 2023"
    retrieval_filters: { zeitraum: "2020_2023" }

  - id: ab-2024
    name: "Ab 2024"
    description: "Nur die neueren Arbeiten"
    retrieval_filters: { zeitraum: ab_2024 }

sources:
  data_dir: ../../data/documents      # served files, so citations open the PDF
  served_extensions: [.pdf]

tools:
  enabled: [search, list_documents, fetch_document, expand_context, verify_claim]

app:
  personalization_enabled: false
  show_settings: true
