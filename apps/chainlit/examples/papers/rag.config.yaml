# =============================================================================
# Reference instance — the shipped example. This is what a fresh clone runs:
# three open-access papers (see data/documents/SOURCES.md) with every feature
# of the template switched on, so you can see what it does before configuring
# your own corpus.
#
# Make it yours:  cp examples/papers/rag.config.yaml my-rag.yaml
#                 (my-rag.yaml is gitignored)
# Paths are relative to THIS file's directory unless noted.
# =============================================================================
name: papers-rag

# The app's citation ("Quelle N") and follow-up ("Anschlussfragen:") parsing is
# currently German-locked, so the assistant answers in German even though the
# papers are English. Set `en` once that parsing is language-aware.
language: de

models:
  # Open-weight models by default — nothing here requires a proprietary vendor.
  # Model names are GATEWAY-SPECIFIC, though: these are the names a LiteLLM proxy
  # exposes. Ask your own gateway for its list (GET /v1/models) and use those
  # strings. Other open options, if your gateway serves them:
  #   chat   : Qwen3 / Llama 3.x instruct / Mistral / Gemma 3 variants
  #   embed  : BGE-M3 or multilingual-E5 (both strong for German), Nomic Embed
  #   vision : Qwen2.5-VL or Gemma 3 vision variants
  # Note: gpt-oss-120b is OpenAI's *open-weight* release (Apache-2.0), not the
  # hosted GPT API — the name is confusing, the licence is not.
  chat_model: gpt-oss-120b
  # 4096-dim. Changing the embedding model requires a re-ingest (--recreate).
  embed_model: octen-embedding-8b
  # Empty = the settings-panel model selector fills itself from the gateway's
  # /v1/models (embedding models are filtered out).
  selectable_chat_models: []

vector_store:
  collection: papers

data_sources:
  - name: papers
    path: ../../data/documents      # relative to this file -> apps/chainlit/data/documents
    format: pdf
    glob: "*.pdf"
    # ---- Pick ONE chunking strategy (swap the `strategy:` value) -------------
    # Available: fixed_size | heading | passthrough | semantic | docling_hybrid
    #   heading        : one chunk per Docling section, oversized ones are split.
    #                    Cheap default for structured PDFs; tables are serialized
    #                    into their section (see include_tables below).
    #   semantic       : split sections at embedding-similarity breakpoints. Good
    #                    for prose, but embeds sentences at ingest time (extra
    #                    calls). Tune with semantic_breakpoint_percentile —
    #                    lower => more, smaller chunks.
    #   docling_hybrid : Docling's native token-aware chunker. Serializes tables
    #                    AND figures itself and sizes chunks by the embedding
    #                    tokenizer, so chunks never overflow the model.
    chunking:
      strategy: semantic
      semantic_breakpoint_percentile: 95.0   # for strategy: semantic
      # hybrid_max_tokens: 512               # for strategy: docling_hybrid
    pdf_options:
      include_tables: true          # serialize tables into their section

retrieval:
  top_k: 5
  # Lets the `search` tool scope to a single document via its `document` argument.
  filterable_fields: [source_file]

sources:
  data_dir: ../../data/documents    # served files (citations open the PDF)
  served_extensions: [.pdf]

# Agentic tools exposed to the model (see docs/tools.md). Remove entries to
# shrink the toolset; `search` alone reproduces classic single-tool RAG.
tools:
  enabled: [search, list_documents, fetch_document, expand_context, verify_claim]
  descriptions:
    list_documents: "Nenne alle Dokumente in der Wissensbasis (exakter source_file, Titel, Umfang). Nutze dies, um Dokumentnamen aufzulösen oder zu fragen, welche Paper vorhanden sind."
    fetch_document: "Lade ein komplettes Paper (alle Abschnitte in Reihenfolge) über seinen exakten source_file. Für Zusammenfassungen/Überblicke besser als die Suche. Hole den source_file zuerst über list_documents."
    expand_context: "Erweitere einen Suchtreffer um seine Nachbarabschnitte (±window um section_index im angegebenen Dokument), wenn ein Treffer abgeschnitten wirkt."
    verify_claim: "Prüfe, ob eine geplante Aussage durch die Wissensbasis gestützt wird; liefert Belegstellen und ein supported-Signal."
  # Both are the schema defaults, spelled out so the limits are visible:
  fetch_max_chunks: 200           # cap for one fetch_document call
  expand_window: 1                # neighbours per side for expand_context

# Figure handling (see docs/images.md). `describe` renders every figure at ingest
# and has the vision model write a searchable description; a figure the answer
# marks is then shown inline above its paragraph.
#   none     -> figures ignored (cheapest)
#   describe -> descriptions + inline/thumbnail display
#   attach   -> additionally feeds figure pixels to a vision chat model
# Re-ingest rule: none -> describe/attach requires one (the figures have to be
# rendered and described); describe <-> attach does NOT, it only changes what is
# sent at query time. `attach` additionally needs a vision-capable CHAT model
# selected in the settings panel.
images:
  mode: describe
  vision_model: gemma-4-31b         # must be vision-capable
  images_scale: 2.0
  # How figures are displayed:
  #   inline_figures        true  = a marked figure appears directly ABOVE its
  #                                 paragraph (the {{ABB:...}} marker protocol)
  #   show_unmarked_figures true  = remaining retrieved figures as thumbnails below
  #                         false = show only figures the answer actually marks
  inline_figures: true
  show_unmarked_figures: false
  max_attach_images: 3              # only used by mode: attach
  vision_capable_models: [gemma-4-31b]

# Automatic answer scoring. Off by default because every scored answer costs two
# judge calls plus one embedding call, and because it needs the separate `eval`
# service running (`docker compose up eval`). With this off the app behaves exactly
# as it would without this block.
#
# Read the numbers as deltas, not as grades: 0.87 on its own says very little,
# 0.87 -> 0.71 after a chunking change says a lot. The dashboard on :8001 groups
# scores by configuration so that comparison is the easy thing to do.
evaluation:
  enabled: false
  metrics: [faithfulness, relevance]
  # faithfulness = are the answer's claims backed by the retrieved chunks
  # relevance    = does the answer address the question that was asked
  judge_model: null                 # null = models.chat_model; prefer a different
                                    # model here, self-judging inflates the scores
  show_inline: true                 # false still records scores for the dashboard

prompt:
  # No system_prompt_path -> the app generates one at startup from the template
  # and a sample of the indexed chunks, then caches it (see docs/prompts.md).
  auto_generate: true
  starter_questions:
    - "Welche Paper sind in der Wissensbasis enthalten?"
    - "Fasse die zentralen Ergebnisse des Kage-2018-Papers zusammen."
    - "Welche Methoden verwenden diese Paper?"
    - "Was sagen die Paper über die Grenzen ihres Ansatzes?"

# Optional roles: each scopes the prompt and (via retrieval_filters) retrieval.
# profiles:
#   - id: beginner
#     name: "Einsteiger:in"
#     prompt_context: "Erkläre Fachbegriffe kurz, wenn sie zum ersten Mal vorkommen."
#   - id: researcher
#     name: "Forscher:in"
#     prompt_context: "Antworte knapp und technisch, nenne Messgrößen und Einheiten."

app:
  # Keyword-based "personality management": the personalization toggle, keyword
  # tags and keyword regeneration in the settings panel. false hides all of it
  # and disables the feature, which keeps the UI minimal.
  personalization_enabled: false
  show_settings: true               # gear panel: model selector + system prompt
