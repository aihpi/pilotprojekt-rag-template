<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Evaluation</title>
<!--
  One file, no build step, no charting library. Every "chart" here is a 0-100%
  bar, which is a div with a percentage width - a dependency would buy nothing
  and would have to be vendored into the repo or fetched from a CDN.
-->
<style>
  :root {
    --bg: #fff; --fg: #1a1a1a; --muted: #666; --line: #e4e4e7;
    --bar: #d4d4d8; --good: #2f855a; --bad: #c53030; --accent: #2b6cb0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b; --fg: #ededed; --muted: #a1a1aa; --line: #303034;
      --bar: #3f3f46; --good: #48bb78; --bad: #fc8181; --accent: #63b3ed;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1.5rem; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  h2 { font-size: 1.05rem; margin: 2.5rem 0 .75rem; }
  .sub { color: var(--muted); margin: 0 0 2rem; font-size: .9rem; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: .55rem .7rem; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; color: var(--muted); font-size: .78rem;
       text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; }

  /* A "chart": track + fill + label. */
  .metric { display: flex; align-items: center; gap: .6rem; min-width: 190px; }
  .track { flex: 1; height: 8px; border-radius: 4px; background: var(--bar); overflow: hidden; }
  .fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .metric span { font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
  .none { color: var(--muted); }
  .up { color: var(--good); } .down { color: var(--bad); }

  .cfg { display: grid; gap: .1rem; }
  .cfg b { font-weight: 600; }
  .cfg small { color: var(--muted); }

  .empty {
    border: 1px solid var(--line); border-radius: 8px; padding: 1.5rem;
    background: color-mix(in srgb, var(--fg) 3%, transparent);
  }
  .empty p { margin: 0 0 .75rem; }
  .empty pre {
    margin: 0; padding: .75rem; overflow-x: auto; border-radius: 6px;
    background: color-mix(in srgb, var(--fg) 7%, transparent); font-size: .85em;
  }
  .note { color: var(--muted); font-size: .85rem; margin-top: 2.5rem;
          border-top: 1px solid var(--line); padding-top: 1rem; }
</style>

<main>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div id="body"></div>
  <p class="note" id="note"></p>
</main>

<script>
/*
  German and English, on the same rule the badges in the chat app use: anything
  that is not German gets English. Only navigator.language here - this page is
  served by the eval container, which has no access to the app's config.toml, so
  the `[UI] language` force does not reach it.
*/
const T = {
  de: {
    title: 'RAG-Evaluation',
    sub: 'Antwortqualität je Konfiguration. Als Veränderung lesen, nicht als Note: eine Treue von 0,87 sagt für sich genommen wenig, 0,87&nbsp;&rarr;&nbsp;0,71 nach einer Chunking-Änderung sagt viel.',
    note: 'Treue fragt, ob die Aussagen der Antwort von den abgerufenen Textstellen gedeckt sind. Relevanz fragt, ob die Antwort zur Frage passt. Beide werden von einem Sprachmodell bewertet und tragen dessen Meinung und Rauschen mit &mdash; Läufe vergleichen, Absolutwerten nicht trauen.',
    loading: 'Wird geladen&hellip;',
    notScored: 'nicht bewertet',
    unknownConfig: 'unbekannte Konfiguration',
    colConfig: 'Konfiguration',
    colAnswers: 'Antworten',
    colFaithfulness: 'Treue',
    colRelevance: 'Relevanz',
    colThumbs: 'Daumen',
    failures: 'Gemeldete Fehler',
    failuresSub: 'Klassifizierte Kommentare zu Daumen runter. Der Anteil bezieht sich auf die Meldungen dieser Konfiguration.',
    colCategory: 'Kategorie',
    colCount: 'Anzahl',
    colShare: 'Anteil',
    categories: {
      hallucination: 'Halluzination',
      wrong_document: 'falsches Dokument',
      incomplete: 'unvollständig',
      irrelevant: 'unpassend',
    },
    emptyTitle: 'Noch keine Bewertungen aufgezeichnet.',
    emptyBody: 'Schalten Sie die Evaluation in Ihrer <code>rag.config.yaml</code> ein und stellen Sie dem Assistenten eine Frage:',
    emptyWhy: 'Bewertung ist standardmäßig aus, weil jede Antwort zwei Judge-Aufrufe plus einen Embedding-Aufruf kostet. Um zwei Konfigurationen zu vergleichen, ingestieren Sie jede in ihre eigene Collection &mdash; gruppiert wird nach Modell, Embedding-Modell, Chunking und Collection.',
    loadError: 'Statistiken konnten nicht geladen werden.',
  },
  en: {
    title: 'RAG Evaluation',
    sub: 'Answer quality per configuration. Read these as deltas, not as grades: a faithfulness of 0.87 says little on its own, 0.87&nbsp;&rarr;&nbsp;0.71 after a chunking change says a lot.',
    note: 'Faithfulness asks whether the answer\'s claims are supported by the retrieved chunks. Relevance asks whether the answer addresses the question. Both are judged by an LLM, so they carry its opinion and its noise &mdash; compare runs, do not trust absolute values.',
    loading: 'Loading&hellip;',
    notScored: 'not scored',
    unknownConfig: 'unknown configuration',
    colConfig: 'Configuration',
    colAnswers: 'Answers',
    colFaithfulness: 'Faithfulness',
    colRelevance: 'Relevance',
    colThumbs: 'Thumbs',
    failures: 'Reported failures',
    failuresSub: 'Thumbs-down comments, classified. Share is of that configuration\'s own complaints.',
    colCategory: 'Category',
    colCount: 'Count',
    colShare: 'Share',
    categories: {
      hallucination: 'hallucination',
      wrong_document: 'wrong document',
      incomplete: 'incomplete',
      irrelevant: 'irrelevant',
    },
    emptyTitle: 'No scores recorded yet.',
    emptyBody: 'Turn evaluation on in your <code>rag.config.yaml</code> and ask the assistant a question:',
    emptyWhy: 'Scoring is off by default because each answer costs two judge calls plus one embedding call. To compare two configurations, ingest each into its own collection &mdash; they are grouped by model, embedding model, chunking and collection.',
    loadError: 'Could not load statistics.',
  },
};

const LANG = (navigator.language || 'en').toLowerCase().indexOf('de') === 0 ? 'de' : 'en';
const S = T[LANG];
document.documentElement.lang = LANG;
document.title = S.title;
document.getElementById('title').textContent = S.title;
document.getElementById('sub').innerHTML = S.sub;
document.getElementById('note').innerHTML = S.note;
document.getElementById('body').innerHTML = S.loading;

// Everything below interpolates values that come out of the database, so they are
// escaped rather than spliced into innerHTML raw. A config signature is written by
// whoever runs the instance, not by a chat user, but the cost of being careful here
// is one function.
const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };

const pct = v => v == null ? null : Math.round(v * 100);

function bar(value) {
  const p = pct(value);
  if (p === null) return `<span class="none">${S.notScored}</span>`;
  return `<div class="metric"><div class="track"><div class="fill" style="width:${p}%"></div></div><span>${p}%</span></div>`;
}

function config(signature) {
  // {chat_model}|{embed_model}|{strategy}|{max_chars}|{collection}
  if (!signature) return `<span class="none">${S.unknownConfig}</span>`;
  const [chat, embed, strategy, chunk, collection] = signature.split('|').map(esc);
  return `<div class="cfg"><b>${chat}</b><small>${embed} &middot; ${strategy} @ ${chunk} &middot; <code>${collection}</code></small></div>`;
}

function thumbs(up, down) {
  if (!up && !down) return '<span class="none">&ndash;</span>';
  return `<span class="up">&#9650;${up}</span> / <span class="down">&#9660;${down}</span>`;
}

function configTable(rows) {
  return `<div class="scroll"><table>
    <thead><tr>
      <th>${S.colConfig}</th><th class="num">${S.colAnswers}</th>
      <th>${S.colFaithfulness}</th><th>${S.colRelevance}</th><th class="num">${S.colThumbs}</th>
    </tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>${config(r.config_signature)}</td>
      <td class="num">${r.answers}</td>
      <td>${bar(r.faithfulness)}</td>
      <td>${bar(r.relevance)}</td>
      <td class="num">${thumbs(r.thumbs_up, r.thumbs_down)}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function failureTable(failures) {
  if (!failures.length) return '';
  // Share within the configuration's own reported failures, not across all of
  // them: "half of this config's complaints were hallucinations" is actionable,
  // "this bar is shorter than another config's bar" is not.
  const totals = {};
  for (const f of failures) {
    totals[f.config_signature] = (totals[f.config_signature] || 0) + f.n;
  }
  return `<h2>${S.failures}</h2>
  <p class="sub" style="margin:-.4rem 0 .75rem">${S.failuresSub}</p>
  <div class="scroll"><table>
    <thead><tr><th>${S.colConfig}</th><th>${S.colCategory}</th><th class="num">${S.colCount}</th><th>${S.colShare}</th></tr></thead>
    <tbody>${failures.map(f => `<tr>
      <td>${config(f.config_signature)}</td>
      <td>${esc(S.categories[f.failure_category] || f.failure_category)}</td>
      <td class="num">${f.n}</td>
      <td>${bar(f.n / totals[f.config_signature])}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

const EMPTY = `<div class="empty">
  <p><strong>${S.emptyTitle}</strong> ${S.emptyBody}</p>
  <pre>evaluation:
  enabled: true</pre>
  <p style="margin:.75rem 0 0">${S.emptyWhy}</p>
</div>`;

fetch('api/stats')
  .then(r => r.json())
  .then(({ configs, failures }) => {
    document.getElementById('body').innerHTML = configs.length
      ? configTable(configs) + failureTable(failures)
      : EMPTY;
  })
  .catch(err => {
    document.getElementById('body').innerHTML =
      `<div class="empty"><p><strong>${S.loadError}</strong></p><pre>${esc(err)}</pre></div>`;
  });
</script>
