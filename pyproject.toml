[project]
# Repo-root project: only the documentation toolchain lives here. The actual
# application is a separate project under apps/chainlit/ (see its pyproject.toml).
name = "rag-template"
version = "0.1.0"
description = "A config-driven, modular RAG template (Chainlit + LiteLLM + Qdrant)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
# Documentation tooling. mkdocs.yml lives at the repo root, so the docs site is
# built from here: `uv run --only-group docs mkdocs serve`.
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-static-i18n>=1.2",
    "pydantic>=2.7",
]
